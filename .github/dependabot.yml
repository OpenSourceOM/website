version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Issue 5: @astrojs/check does not accept TypeScript 7 yet.
      - dependency-name: "typescript"
        versions: ["7.x"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
