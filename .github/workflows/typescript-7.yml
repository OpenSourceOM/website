name: TypeScript 7

on:
  schedule:
    # 15:00 UTC on the 1st. Stays quiet until @astrojs/check accepts TypeScript 7.
    - cron: "0 15 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Comment on issue 5 when TypeScript 7 is accepted
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          range=$(npm view @astrojs/check@latest peerDependencies.typescript)
          echo "typescript peer: ${range}"
          # Published ranges look like "^5.0.0 || ^6.0.0".
          printf '%s\n' "$range" | grep -Eq '(^|[^0-9])7\.' || exit 0
          marker="<!-- typescript-7-ready -->"
          if gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/5/comments" --jq '.[].body' | grep -F -q "$marker"; then
            exit 0
          fi
          gh issue reopen 5 --repo "$GITHUB_REPOSITORY" || true
          gh issue comment 5 --repo "$GITHUB_REPOSITORY" --body "$(cat <<EOF
          ${marker}
          \`@astrojs/check\` now accepts TypeScript 7 (\`${range}\`).

          Remove the \`typescript\` \`7.x\` ignore in \`.github/dependabot.yml\`, then bump \`typescript\`. The ignore on pull request #1 can still suppress Dependabot, so bump the dependency directly or reopen that pull request.
          EOF
          )"
